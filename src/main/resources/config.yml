# Радиус заражения в блоках вокруг игрока
radius-blocks: 300
# Потолок в чанках: заражаются только ЗАГРУЖЕННЫЕ чанки.
# При симуляции 8 чанков реальный радиус = 8 чанков (~128 блоков).
# Поднимете симуляцию/дальность прорисовки - можно увеличить.
max-chunk-radius: 8

# Как часто срабатывает цикл (случайное время между min и max)
interval-minutes:
  min: 15
  max: 20

# Какая доля травы заменяется за один цикл
infection-percent: 20

# Сколько чанков обрабатывать за тик (меньше = мягче для TPS)
chunks-per-tick: 2

# На что заменяется трава: блок: вес (чем больше вес, тем чаще)
blocks:
  NETHERRACK: 60
  CRIMSON_NYLIUM: 20
  WARPED_NYLIUM: 8
  SOUL_SOIL: 6
  BLACKSTONE: 4
  MAGMA_BLOCK: 2

# Звук в момент срабатывания (у каждого заражаемого игрока)
sound:
  enabled: true
  key: "minecraft:entity.warden.heartbeat"
  volume: 1.0
  pitch: 0.7

# Молнии в местах, где появился незерак
lightning:
  enabled: true
  # Сколько ударов за цикл на каждого заражаемого игрока
  # (по одному в случайном обрабатываемом чанке)
  per-player-per-cycle: 3
  # false = только визуальная вспышка и гром (безопасно)
  # true = настоящая молния: урон, огонь, превращает жителей в ведьм,
  # криперов в заряженных, свиней в зомби-пиглинов
  real: false
  # Пауза между ударом молнии и появлением блоков в этом чанке (20 тиков = 1 сек)
  block-delay-ticks: 20
